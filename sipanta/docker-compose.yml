# Basis data pengembangan: PostgreSQL 16 + PostGIS 3.4
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: sipanta
      POSTGRES_PASSWORD: sipanta
      POSTGRES_DB: sipanta
    ports:
      - "5432:5432"
    volumes:
      - sipanta_pg:/var/lib/postgresql/data
volumes:
  sipanta_pg:
